[plugin]

name="dot-replay"
description="Match demos: a recorder for what a dedicated server authoritatively decided, as tick-stamped opaque records on named channels; periodic keyframes so playback can seek; a versioned, chunked, compressed file whose chunks are hash-chained so a tampered file is refused and a crashed one still plays up to its last complete chunk; a player at 0.25x to 8x with pause, seek and a channel filter; an in-memory ring for saving the last minute as evidence; duck-typed taps for a server's event bus and a netcode manager's outgoing stream; and a client-side final killcam over a bounded buffer of decoded frames. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_replay_plugin.gd"
